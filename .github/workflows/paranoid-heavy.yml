name: Paranoid kernel check (heavy proofs)

# Decisions 55 and 57: the heavy proofs (lean_lib HeavyProofs) are not in the default target, so
# the weekly `paranoid.yml` (`lake check --paranoid`) does not see them.
# 1. paranoid-heavy-export builds them in the bwrap sandbox (scripts/check_heavy_proofs.sh,
#    SKIP_REPLAY=1) and exports every heavy module with one sandboxed `leanexport` call.
#    `scripts/check_export_scope.py` then checks that the export declares every constant of
#    every heavy module (list from tools/HeavyDecls.lean), so the scope is checked on each run,
#    not assumed (review batch 8, gap 4).
# 2. paranoid-heavy-kernel runs one kernel per job (scripts/run_kernel.sh, the same commands as
#    `lake check --paranoid`), so each job has its own 360 min budget. The default kernel took
#    33 min on the export locally (2026-11-14).
on:
  schedule:
    - cron: "41 3 * * 0" # Sundays 03:41 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paranoid-heavy-export:
    name: Heavy proofs export
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          auto-config: "false"
      - name: Allow bwrap user namespaces
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo scripts/setup-bwrap-apparmor.sh
      - name: Build heavy proofs in the sandbox and audit
        run: SKIP_REPLAY=1 HEAVY_MODULES_OUT="$RUNNER_TEMP/heavy-modules.txt" scripts/check_heavy_proofs.sh
      - name: Export every heavy module
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          mapfile -t mods < "$RUNNER_TEMP/heavy-modules.txt"
          mkdir -p "$RUNNER_TEMP/export"
          scripts/sandbox.sh "$(command -v lake)" env leanexport "${mods[@]}" > "$RUNNER_TEMP/export/heavy.ndjson"
          ls -l "$RUNNER_TEMP/export/heavy.ndjson"
          # evidence for the export scope (review batch 8): every constant of every heavy module
          # (tools/HeavyDecls.lean, in the sandbox) is declared in the export
          scripts/sandbox.sh "$(command -v lake)" env lean --run tools/HeavyDecls.lean "${mods[@]}" > "$RUNNER_TEMP/heavy-decls.txt"
          python3 scripts/check_export_scope.py "$RUNNER_TEMP/export/heavy.ndjson" "$RUNNER_TEMP/heavy-decls.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: heavy-export
          path: ${{ runner.temp }}/export/heavy.ndjson
          if-no-files-found: error
          retention-days: 3

  paranoid-heavy-kernel:
    name: Kernel ${{ matrix.kernel }} (heavy proofs)
    needs: paranoid-heavy-export
    runs-on: ubuntu-26.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        kernel: [default, lean-paranoid, lean4lean, nanoda, con-leche, con-ron]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          auto-config: "false"
      - name: Allow bwrap user namespaces
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo scripts/setup-bwrap-apparmor.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: heavy-export
          path: ${{ runner.temp }}/export
      - name: Replay the export
        run: scripts/run_kernel.sh "${{ matrix.kernel }}" "$RUNNER_TEMP/export/heavy.ndjson"
