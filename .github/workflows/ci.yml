name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lean:
    name: Lean build and proof checks
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the toolchain from lean-toolchain, caches .lake, then:
      # - lake build --wfail      (warnings are errors)
      # - lake test               (only when a test driver exists)
      # - leanchecker             (re-checks the environment with the kernel)
      # - axiom-audit             (only propext, Classical.choice, Quot.sound)
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          build-args: "--wfail"
          leanchecker: "true"
          # Without this, leanchecker looks for a module named after the
          # package («Cats-effect-in-lean»), which does not exist.
          leanchecker-args: "CatsEffectInLean"
          axiom-audit: "true"
          axiom-audit-allow: "propext,Classical.choice,Quot.sound"
          axiom-audit-root: "CatsEffectInLean"

      # `lake check` builds in a bwrap sandbox. Ubuntu restricts the user
      # namespaces that bwrap needs, so grant them to bwrap only.
      - name: Allow bwrap user namespaces
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo scripts/setup-bwrap-apparmor.sh

      - name: lake check (sandboxed build + kernel replay + axiom check)
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake check

      # Registry audit: theorem types are exactly `prop` / `¬ prop`, only allowed
      # axioms, registry and inventory agree (wiki/methodology/registry-and-audit.md).
      - name: Registry audit
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe audit

      # The audit must accept a good fixture registry and reject planted faults.
      - name: Registry audit self-test
        run: scripts/test_audit.sh

      # Lean side of the difftest: build the decoder/translation (its #guard checks run
      # during the build), then decode, translate and run every golden case. `cediff` exits 1
      # if it rejects a case (wiki/methodology/difftest-program-format.md, "Lean side").
      # The comparison with Scala is in the `difftest` job.
      - name: Difftest decoder (Lean)
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build --wfail Difftest cediff
          lake exe cediff difftest/cases/basic.jsonl difftest/cases/sched.jsonl difftest/cases/deferred.jsonl difftest/cases/racesleep.jsonl difftest/cases/syncstep.jsonl difftest/cases/resource.jsonl difftest/cases/queue.jsonl difftest/cases/race.jsonl difftest/cases/preempt.jsonl difftest/cases/bracket.jsonl difftest/cases/memoize.jsonl difftest/cases/resuse.jsonl difftest/cases/partraverse.jsonl > /dev/null

  # Scala side of the difftest: runner tests against cats-effect 3.7.1 (golden files,
  # rerun determinism, hand-checked facts). See difftest/README.md.
  difftest:
    name: Difftest runner (Scala)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
          cache-dependency-path: |
            difftest/build.sbt
            difftest/project/build.properties
      - uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14
      - name: sbt test
        working-directory: difftest
        run: sbt -batch test
      # Generator + driver self-test (Python stdlib): well-typed generated cases, no TypeError,
      # deterministic Scala runs, bins, shrinker, corpus rerun. About 15 s. See difftest/py/.
      - name: Difftest generator and driver self-test
        run: python3 difftest/py/selftest.py
      # Lean model against Scala, replay mode (wiki/methodology/differential-testing.md):
      # every case that the model can run must agree on all compared fields. Testcontrol-mode
      # cases are `unsupported` (decision 15); all replay ops run (also `timeoutTo` since track D).
      # 25% of generated cases have small IORuntimeConfig thresholds (auto-yield = a `preempt`
      # choice, gate caveat 3). Each format-v1 op must be in >= 150 agreeing cases. Any mismatch, harness error or hang fails the job. A mismatch of a known
      # model bug fails the job too (decision 32: CI never passes --allow-known-model-bugs). Installs only the Lean
      # toolchain; `cediff` needs the model, not the proofs.
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          auto-config: "false"
      - name: Difftest agreement (Lean model vs Scala)
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build --wfail cediff
          python3 difftest/py/drive.py check --lean "lake exe cediff" difftest/cases/basic.jsonl difftest/cases/sched.jsonl difftest/cases/deferred.jsonl difftest/cases/racesleep.jsonl difftest/cases/syncstep.jsonl difftest/cases/resource.jsonl difftest/cases/queue.jsonl difftest/cases/race.jsonl difftest/cases/preempt.jsonl difftest/cases/bracket.jsonl difftest/cases/memoize.jsonl difftest/cases/resuse.jsonl difftest/cases/partraverse.jsonl
          python3 difftest/py/drive.py corpus --lean "lake exe cediff"
          python3 difftest/py/drive.py run --seeds 1 2 3 --n 2000 --modes replay --lean "lake exe cediff" --min-v1-agree 150

  twin-checks:
    # CE-0002 fixed-twin checks (lean_lib TwinChecks; decision 39). One `decide +kernel` needs up
    # to 13 GB, so this job builds one module per Lean process and nothing else in parallel.
    # It also checks the axioms of the three result theorems.
    name: Fixed-twin checks (heavy, sequential)
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          auto-config: "false"
      - name: Build twin checks one module at a time, check axioms
        run: scripts/check_twin_checks.sh

  inventory:
    name: Inventory check
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/check_inventory.py

  forbidden:
    name: Forbidden proof escapes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/check_forbidden.py

  wiki:
    name: Wiki lint
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/check_wiki.py
