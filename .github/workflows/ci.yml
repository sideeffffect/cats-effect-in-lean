name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lean:
    name: Lean build and proof checks
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Installs the toolchain from lean-toolchain, caches .lake, then:
      # - lake build --wfail      (warnings are errors)
      # - lake test               (only when a test driver exists)
      # - leanchecker             (re-checks the environment with the kernel)
      # - axiom-audit             (only propext, Classical.choice, Quot.sound)
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          build-args: "--wfail"
          leanchecker: "true"
          # Without this, leanchecker looks for a module named after the
          # package («Cats-effect-in-lean»), which does not exist.
          leanchecker-args: "CatsEffectInLean"
          axiom-audit: "true"
          axiom-audit-allow: "propext,Classical.choice,Quot.sound"
          axiom-audit-root: "CatsEffectInLean"
          # No GitHub cache: `lake env leanchecker CatsEffectInLean` replays every
          # CatsEffectInLean.* .olean on disk, also stale ones that a restored cache carries
          # (CI run 43679857057: `Model/ValCodec.olean`, deleted in decision 31, no longer
          # matched `Val` after decision 58). A cold build costs a few minutes.
          use-github-cache: "false"

      # `lake check` builds in a bwrap sandbox. Ubuntu restricts the user
      # namespaces that bwrap needs, so grant them to bwrap only.
      - name: Allow bwrap user namespaces
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo scripts/setup-bwrap-apparmor.sh

      - name: lake check (sandboxed build + kernel replay + axiom check)
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake check

      # Registry audit: theorem types are exactly `prop` / `¬ prop`, only allowed
      # axioms, registry and inventory agree (wiki/methodology/registry-and-audit.md).
      # Heavy-registry entries (decision 55) get every check that needs no heavy module here;
      # inventory rows that only a heavy entry settles are deferred to the `heavy-proofs` job.
      - name: Registry audit
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe audit

      # The audit must accept a good fixture registry and reject planted faults.
      - name: Registry audit self-test
        run: scripts/test_audit.sh

      # Lean side of the difftest: build the decoder/translation (its #guard checks run
      # during the build), then decode, translate and run every golden case. `cediff` exits 1
      # if it rejects a case (wiki/methodology/difftest-program-format.md, "Lean side").
      # The comparison with Scala is in the `difftest` job.
      - name: Difftest decoder (Lean)
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build --wfail Difftest cediff
          lake exe cediff difftest/cases/basic.jsonl difftest/cases/sched.jsonl difftest/cases/deferred.jsonl difftest/cases/racesleep.jsonl difftest/cases/syncstep.jsonl difftest/cases/resource.jsonl difftest/cases/queue.jsonl difftest/cases/race.jsonl difftest/cases/preempt.jsonl difftest/cases/bracket.jsonl difftest/cases/memoize.jsonl difftest/cases/resuse.jsonl difftest/cases/partraverse.jsonl difftest/cases/latch.jsonl > /dev/null

  # Scala side of the difftest: runner tests against cats-effect 3.7.1 (golden files,
  # rerun determinism, hand-checked facts). See difftest/README.md.
  difftest:
    name: Difftest runner (Scala)
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
          cache-dependency-path: |
            difftest/build.sbt
            difftest/project/build.properties
      - uses: sbt/setup-sbt@67d461eba2c4753196c230e02da850757ba4775e # v1.5.14
      - name: sbt test
        working-directory: difftest
        run: sbt -batch test
      # Generator + driver self-test (Python stdlib): well-typed generated cases, no TypeError,
      # deterministic Scala runs, bins, shrinker, corpus rerun. About 15 s. See difftest/py/.
      - name: Difftest generator and driver self-test
        run: python3 difftest/py/selftest.py
      # Lean model against Scala, replay mode (wiki/methodology/differential-testing.md):
      # every case that the model can run must agree on all compared fields. Testcontrol-mode
      # cases are `unsupported` (decision 15); all replay ops run (also `timeoutTo` since track D).
      # 25% of generated cases have small IORuntimeConfig thresholds (auto-yield = a `preempt`
      # choice, gate caveat 3). Each format-v1 op must be in >= 150 agreeing cases. Any mismatch, harness error or hang fails the job. A mismatch of a known
      # model bug fails the job too (decision 32: CI never passes --allow-known-model-bugs). Installs only the Lean
      # toolchain; `cediff` needs the model, not the proofs.
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          auto-config: "false"
      - name: Difftest agreement (Lean model vs Scala)
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build --wfail cediff
          python3 difftest/py/drive.py check --lean "lake exe cediff" difftest/cases/basic.jsonl difftest/cases/sched.jsonl difftest/cases/deferred.jsonl difftest/cases/racesleep.jsonl difftest/cases/syncstep.jsonl difftest/cases/resource.jsonl difftest/cases/queue.jsonl difftest/cases/race.jsonl difftest/cases/preempt.jsonl difftest/cases/bracket.jsonl difftest/cases/memoize.jsonl difftest/cases/resuse.jsonl difftest/cases/partraverse.jsonl difftest/hashcases/partraverse_hash.jsonl difftest/cases/latch.jsonl
          python3 difftest/py/drive.py corpus --lean "lake exe cediff"
          python3 difftest/py/drive.py run --seeds 1 2 3 --n 2000 --modes replay --lean "lake exe cediff" --min-v1-agree 150

  # Fixed-twin checks and smoke tests (lean_lib TwinChecks; decisions 39, 45, 57). Same layout
  # as the heavy proofs below: twin-plan derives the matrix from the lakefile roots (families of
  # modules, at most 5 per entry); twin-module builds each entry in the bwrap sandbox (each
  # build may change only its own artifacts) and uploads its artifacts; twin-aggregate installs
  # them unchanged, builds the aggregating roots in the sandbox and checks the axioms of the
  # result theorems; twin-checks is the stable required check.
  twin-plan:
    name: Twin checks plan
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      entries: ${{ steps.plan.outputs.entries }}
      has_entries: ${{ steps.plan.outputs.has_entries }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        run: |
          entries=$(python3 scripts/heavy_closure.py --from-lakefile --lib TwinChecks --matrix --groups 5)
          echo "$entries"
          echo "entries=$entries" >> "$GITHUB_OUTPUT"
          if [ "$entries" = "[]" ]; then echo "has_entries=false"; else echo "has_entries=true"; fi >> "$GITHUB_OUTPUT"

  twin-module:
    name: Twin module (${{ matrix.entry.name }})
    needs: twin-plan
    if: needs.twin-plan.outputs.has_entries == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.twin-plan.outputs.entries) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          auto-config: "false"
      - name: Allow bwrap user namespaces
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo scripts/setup-bwrap-apparmor.sh
      - name: Build in the sandbox
        run: SKIP_REPLAY=1 HEAVY_ARTIFACT_OUT="$RUNNER_TEMP/twin-artifacts" scripts/check_heavy_module.sh --lib TwinChecks ${{ matrix.entry.modules }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: twin-${{ strategy.job-index }}
          path: ${{ runner.temp }}/twin-artifacts
          if-no-files-found: error
          retention-days: 3

  twin-aggregate:
    name: Twin checks aggregate (roots, axioms)
    needs: [twin-plan, twin-module]
    if: >-
      always() && needs.twin-plan.result == 'success' &&
      (needs.twin-module.result == 'success' ||
       (needs.twin-module.result == 'skipped' && needs.twin-plan.outputs.has_entries == 'false'))
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          auto-config: "false"
      - name: Allow bwrap user namespaces
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo scripts/setup-bwrap-apparmor.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.twin-plan.outputs.has_entries == 'true'
        with:
          pattern: twin-*
          merge-multiple: true
          path: ${{ runner.temp }}/twin-artifacts
      - name: Install module artifacts, build the aggregating roots, check axioms
        run: TWIN_ARTIFACTS_IN="$RUNNER_TEMP/twin-artifacts" scripts/check_twin_checks.sh

  twin-checks:
    # Stable name for the required check (decision 57).
    name: twin-checks
    needs: [twin-plan, twin-module, twin-aggregate]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: All twin jobs succeeded
        run: |
          echo "plan=${{ needs.twin-plan.result }} module=${{ needs.twin-module.result }} aggregate=${{ needs.twin-aggregate.result }} has_entries=${{ needs.twin-plan.outputs.has_entries }}"
          test "${{ needs.twin-plan.result }}" = success
          test "${{ needs.twin-aggregate.result }}" = success
          if [ "${{ needs.twin-plan.outputs.has_entries }}" = true ]; then
            test "${{ needs.twin-module.result }}" = success
          else
            test "${{ needs.twin-plan.outputs.has_entries }}" = false
            test "${{ needs.twin-module.result }}" = skipped
          fi

  # Heavy proofs (decisions 55 and 57): lean_lib HeavyProofs, registry
  # CatsEffectInLean/RegistryHeavy.lean. Not in the default target, so the `lean` job (60 min)
  # does not build them. Four jobs, on every push and pull request:
  #   heavy-plan     derives the matrix from the lakefile roots (scripts/heavy_closure.py);
  #   heavy-module   one job per non-root heavy module: sandboxed build (only `.lake` writable,
  #                  each build may change only its own artifacts) and leanchecker replay;
  #                  uploads the module's artifacts;
  #   heavy-audit    checks that every non-root module has artifacts (and that heavyModules
  #                  matches the lakefile), installs them unchanged, builds and replays the
  #                  roots in the sandbox, runs a copy of audit_heavy built before (both
  #                  registries in full, deferred inventory rows included) and the axiom check;
  #   heavy-proofs   the stable required check: fails unless all three succeeded.
  heavy-plan:
    name: Heavy proofs plan
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      modules: ${{ steps.plan.outputs.modules }}
      has_modules: ${{ steps.plan.outputs.has_modules }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: plan
        run: |
          modules=$(python3 scripts/heavy_closure.py --from-lakefile --matrix)
          echo "$modules"
          echo "modules=$modules" >> "$GITHUB_OUTPUT"
          # an empty matrix is an error in GitHub Actions; skip the module jobs then (review
          # batch 8), and let heavy-audit and heavy-proofs accept that skip only in this case
          if [ "$modules" = "[]" ]; then echo "has_modules=false"; else echo "has_modules=true"; fi >> "$GITHUB_OUTPUT"

  heavy-module:
    name: Heavy module (${{ matrix.entry.name }})
    needs: heavy-plan
    if: needs.heavy-plan.outputs.has_modules == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        entry: ${{ fromJSON(needs.heavy-plan.outputs.modules) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          auto-config: "false"
      - name: Allow bwrap user namespaces
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo scripts/setup-bwrap-apparmor.sh
      - name: Build in the sandbox and replay
        run: HEAVY_ARTIFACT_OUT="$RUNNER_TEMP/heavy-artifacts" scripts/check_heavy_module.sh ${{ matrix.entry.modules }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: heavy-${{ strategy.job-index }}
          path: ${{ runner.temp }}/heavy-artifacts
          if-no-files-found: error
          retention-days: 3

  heavy-audit:
    name: Heavy proofs audit (roots, audit_heavy, axioms)
    needs: [heavy-plan, heavy-module]
    if: >-
      always() && needs.heavy-plan.result == 'success' &&
      (needs.heavy-module.result == 'success' ||
       (needs.heavy-module.result == 'skipped' && needs.heavy-plan.outputs.has_modules == 'false'))
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          auto-config: "false"
      - name: Allow bwrap user namespaces
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap
          sudo scripts/setup-bwrap-apparmor.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.heavy-plan.outputs.has_modules == 'true'
        with:
          pattern: heavy-*
          merge-multiple: true
          path: ${{ runner.temp }}/heavy-artifacts
      - name: Install module artifacts, build and replay the roots, audit both registries, axioms
        run: HEAVY_ARTIFACTS_IN="$RUNNER_TEMP/heavy-artifacts" scripts/check_heavy_proofs.sh

  heavy-proofs:
    # Stable name for the required check (decision 57): the matrix can change without a change
    # in branch protection.
    name: heavy-proofs
    needs: [heavy-plan, heavy-module, heavy-audit]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: All heavy jobs succeeded
        run: |
          echo "plan=${{ needs.heavy-plan.result }} module=${{ needs.heavy-module.result }} audit=${{ needs.heavy-audit.result }} has_modules=${{ needs.heavy-plan.outputs.has_modules }}"
          test "${{ needs.heavy-plan.result }}" = success
          test "${{ needs.heavy-audit.result }}" = success
          # module jobs: success, or skipped because the plan found no non-root module
          if [ "${{ needs.heavy-plan.outputs.has_modules }}" = true ]; then
            test "${{ needs.heavy-module.result }}" = success
          else
            test "${{ needs.heavy-plan.outputs.has_modules }}" = false
            test "${{ needs.heavy-module.result }}" = skipped
          fi

  inventory:
    name: Inventory check
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/check_inventory.py

  forbidden:
    name: Forbidden proof escapes
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/check_forbidden.py

  wiki:
    name: Wiki lint
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 scripts/check_wiki.py
