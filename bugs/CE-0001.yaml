    Resource.use release runs on cancel: direct=true stepped=false DIFFERENT
    uncancelable body completes before cancel: direct=true stepped=false DIFFERENT
    onCancel finalizer runs on cancel: direct=true stepped=false DIFFERENT
    canceled inside uncancelable is a no-op: direct=true stepped=false DIFFERENT
    cases that differ: 4 / 4
    REPRODUCED CE-0001
  # series/3.x = 3.7.1-89-de84c01 (origin/series/3.x de84c01f76), publishLocal, 2026-11-10 (case 4 added and rerun the same day)
  series/3.x: |
    Resource.use release runs on cancel: direct=true stepped=false DIFFERENT
    uncancelable body completes before cancel: direct=true stepped=false DIFFERENT
    onCancel finalizer runs on cancel: direct=true stepped=false DIFFERENT
    canceled inside uncancelable is a no-op: direct=true stepped=false DIFFERENT
    cases that differ: 4 / 4
    REPRODUCED CE-0001
  # series/3.7.x = 3.7.1-15-2f94201 (origin/series/3.7.x 2f9420145f), publishLocal, 2026-11-10
  series/3.7.x: |
    Resource.use release runs on cancel: direct=true stepped=false DIFFERENT
    uncancelable body completes before cancel: direct=true stepped=false DIFFERENT
    onCancel finalizer runs on cancel: direct=true stepped=false DIFFERENT
    canceled inside uncancelable is a no-op: direct=true stepped=false DIFFERENT
    cases that differ: 4 / 4
    REPRODUCED CE-0001
expected: |
  Each case: direct and stepped give the same value (true), so the last line is
  NOT REPRODUCED CE-0001.
promised_by:
  - "AsyncLaws.syncStepIdentity, laws/shared/src/main/scala/cats/effect/laws/AsyncLaws.scala:84-88: F.syncStep(fa, limit).flatMap { case Left(fa) => fa; case Right(a) => F.pure(a) } <-> fa"
  - "Scaladoc of IO#syncStep, core/shared/src/main/scala/cats/effect/IO.scala:1154-1156: 'runs the original IO to its completion, the limit number of stages, or until the first stage that cannot be expressed with SyncIO (typically an asynchronous boundary)' (the Left value is the rest of the original IO)"
cause: >
  IO.scala:2390-2397. The Uncancelable and OnCancel branches are guarded only by
  G.rootCancelScope == CancelScope.Uncancelable. They are correct while the walk stays in G, but
  on the Left path the caller gets `ioa` (or `body(identityPoll)`) instead of the wrapped node.
  The laws do not catch it: syncStepIdentity is checked with G = F = IO (cancelable root scope),
  which never takes these branches.
possible_fix: >
  Upstream PR #4700 "Keep uncancelable and onCancel on the syncStep remainder" (open, head
  0c6f3c05, base series/3.7.x; read 2026-11-10). For OnCancel it maps Left(rest) to
  Left(rest.onCancel(fin)). For Uncancelable it does not keep IdPoll: the body gets a
  DeferredPoll whose poll(io) is IO.Local(Unmask).flatten, which applies the real Poll that is
  bound in the running fiber's IOLocal state (or runs io unchanged if none is bound); the rest
  becomes Uncancelable(Bind(deferred, rest)), and Bind binds the real Poll of that run while the
  rest runs (rest.attempt <* restore).rethrow. A separate commit wraps the body call in a try
  (non-fatal throw -> IO.raiseError), as the run loop does. Note: a fix that only re-wraps the
  rest in uncancelable and keeps IdPoll in the continuation is incomplete (review batch 2): for
  IO.uncancelable(p => IO.cede *> p(IO.canceled)) its rest ignores the cancel. PR #4700 does not
  have this gap. Lean fixed twin (decision 39): Model/SyncStepFixed.lean mirrors PR #4700; it
  satisfies the property on a bounded domain of 10 non-fatal programs, including polls after an
  async boundary, an escaped poll and nested regions (Proofs/Calibration/SyncStepTwin.lean,
  fixed_twin), and v3.7.1 fails 5 of them (v371_fails).
