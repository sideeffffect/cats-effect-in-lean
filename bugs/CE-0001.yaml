  property: CatsEffectInLean.Props.Calibration.syncStepIdentitySyncIO   # CatsEffectInLean/Props/Calibration/SyncStep.lean
  theorem: CatsEffectInLean.Proofs.Calibration.syncStepIdentitySyncIO_refuted   # CatsEffectInLean/Proofs/Calibration/SyncStep.lean
  registry: core.IO.syncStep.syncStepIdentitySyncIO
  counterexample: "reproducer case 4: IO.uncancelable(_ => IO.canceled *> flag.set(true)), limit Int.MaxValue; direct Succeeded(()) with flag = true; stepped Canceled with flag = false"
  model: CatsEffectInLean/Model/SyncIO.lean (SyncIO run loop), CatsEffectInLean/Model/SyncStep.lean (SyncStep.interpret, G = SyncIO)
  fixed_twin: "CatsEffectInLean.Proofs.Calibration.SyncStepTwin.fixed_twin (PR #4700 twin satisfies StepIdentityFor on programs 1-10 of SyncStepTwinFamily.lean) and v371_fails (v3.7.1 fails programs 1, 4, 5, 6, 10). Program 10 (a throwing uncancelable body) is a second difference that the PR fixes: in v3.7.1 the throw leaves interpret (Scala: it leaves the syncStep call itself)."
  statement: "step-only schedules of the single-fiber driver (no external cancel, decision 26); hypotheses WellFormed (decisions 27 and 37: poll values are opaque to user code, no user UnmaskRunLoop with mask id 0) and NonFatalOnly (decision 38: only non-fatal errors; the fatal-error difference between the IO and SyncIO run loops is CE-0004); observations compared up to Poll identity (eraseObs). The witness is proven well-formed (cx_wellFormed) and non-fatal (cx_nonFatal). Re-run 2026-11-10: REPRODUCED CE-0001 on 3.7.1 (4 / 4 cases differ)."
