id: CE-0091
title: "Dispatcher.parallel(await = true) drops an effect that was submitted before the scope exits but not yet taken by a worker; its Future never completes"
status: draft  # found in Phase 7 batch 7.2, track P7D (2026-11-25) by the Lean model (difftest case, then a property); reproduced on v3.7.1, series/3.x, series/3.7.x; refuted in Lean
priority: medium
kind: lost-effect
area: std
files:
  - std/shared/src/main/scala/cats/effect/std/Dispatcher.scala:254-285  # resource order: workers are released before the executor
  - std/shared/src/main/scala/cats/effect/std/Dispatcher.scala:417       # the worker calls executor(action) when it takes a registration
  - std/shared/src/main/scala/cats/effect/std/Dispatcher.scala:461-469   # PoisonPill: the worker stops
  - std/shared/src/main/scala/cats/effect/std/Dispatcher.scala:487       # Worker finalizer: offers the PoisonPill, does not wait for the worker
  - std/shared/src/main/scala/cats/effect/std/Dispatcher.scala:615-621   # Executor.parallel = Supervisor(await): supervise on a closed supervisor raises
  - std/shared/src/main/scala/cats/effect/std/Supervisor.scala:320-323   # IllegalStateException("supervisor already shutdown")
functions:
  - Dispatcher.parallel (await = true)
  - Dispatcher#unsafeRunAndForget, unsafeToFutureCancelable, unsafeToFuture, unsafeRunSync
summary: >
  `Dispatcher.parallel(await = true).use(d => IO(d.unsafeRunAndForget(fa)))` usually never runs
  `fa`. The submission puts a `Primary` registration on a worker queue and wakes the worker. If
  the scope exits before the worker fiber takes the registration, the release runs the finalizers
  in reverse order: the `Worker` finalizer offers a `PoisonPill` behind the registration
  (Dispatcher.scala:487) and returns at once; then the executor `Supervisor(await = true)` is
  released (:615-621): it sets its done flag and joins the fibers it holds, which are none. When
  the worker then takes the registration it calls `executor(action)` =
  `supervisor.supervise(task)` (:417, :619) on the closed supervisor, which raises
  `IllegalStateException("supervisor already shutdown")` (Supervisor.scala:320-323). The worker
  fiber fails with it (the runtime prints it), the outer Supervisor does not restart it, the
  effect never runs and its `Future` is never completed (a caller blocked in `unsafeRunSync`
  hangs). `sequential(await = true)` runs the same effect: its executor is in place, and the worker
  drains the queue before the pill (the Cats Effect test "await work queue drain on shutdown"
  checks this for `sequential` only).
likelihood: >
  Medium to high. The shape is the example of issue #3506 (closed as fixed in 3.4.9): submit and
  leave the scope at once with await = true. Any code that submits work just before a graceful
  shutdown (a callback that fires during shutdown, a last `unsafeRunAndForget` in a `use`) can lose
  it. The reproducer shows it in 50/50 TestControl seeds and in about 190/200 runs on the default
  runtime (the worker usually loses the race); `unsafeToFuture` gives a Future that stays `None`.
maybe_intended: >
  Unlikely. Issue #3506 ("Dispatcher#unsafeRunAndForget seems not to await despite (await = true)")
  reported this program shape and was closed as fixed ("I confirmed that the given example prints
  as expected using CE 3.4.9"). The current test for #3506 (DispatcherSuite.scala:639-647) waits
  until the effect has started (`latch.get`) before it leaves the scope, so it does not cover a
  registration that is still in the queue; the rewrite of Dispatcher (PR #3923) brought the present
  release order. The `sequential` twin drains the queue (its test), so the two modes disagree.
  Scaladoc of `parallel(await)` (:130-133, :160-163): "all active effects will be ... awaited";
  "true - wait for the completion of the active fibers". A maintainer can argue that an effect that
  has not started is not "active"; then it should at least fail or be canceled, not stay pending
  forever, and the worker should not die with IllegalStateException.
reproducer: reproducers/CE-0091/Repro.scala
