    REPRODUCED CE-0091
  # Found first in a generated difftest case (Lean and Scala agreed: no emit of the dispatched
  # effect, failure "IllegalStateException: supervisor already shutdown"), then checked here.
expected: |
  With await = true the effect submitted before the scope exits runs before `use` returns (as for
  `sequential`, and as issue #3506 was closed), so P(true) is true in every seed and the Future is
  `Some(Success(42))`. The reproducer then prints 50/50 for both modes and NOT REPRODUCED CE-0091.
promised_by:
  - "Scaladoc of Dispatcher.parallel(await) (Dispatcher.scala:130-133, :160-163): 'Once the resource scope exits, depending on the termination policy all active effects will be canceled or awaited'; 'true - wait for the completion of the active fibers'."
  - "Issue #3506 (closed as fixed in 3.4.9) with this exact program shape."
  - "Twin: Dispatcher.sequential(await = true) drains the queue (DispatcherSuite 'await work queue drain on shutdown')."
cause: >
  The workers are released before the executor (they are acquired after it, Dispatcher.scala:273-279),
  and the Worker finalizer only offers the PoisonPill (:487); it does not wait until the worker has
  handed the registrations before the pill to the executor. So the executor Supervisor can close
  while registrations are still queued; the worker then calls supervise on a closed supervisor.
possible_fix: >
  In the Worker finalizer, after offering the PoisonPill, wait until the worker has taken it (for
  example complete a Deferred in the PoisonPill branch, :461-462, and `get` it in the finalizer).
  The worker then hands every earlier registration to the executor while the executor is still
  open, and `Supervisor(await = true)` joins them. (For `sequential` the effects run in place, so
  only `parallel` needs the wait; with await = false the executor cancels them.) The Lean fixed twin
  (variant 31 of Std/Dispatcher.lean) waits for the worker's doneR flag after the pill: on the
  refuting input the effect runs (DispatcherBattery.awaitDrains_twin31).
