  series/3.x: |
    await=true TestControl: Map(lost -> 50); lost in 50/50 seeds
    await=true default runtime: Map(lost -> 50); lost in 50/50 runs
    await=false default runtime (timing-dependent): threw
    REPRODUCED CE-0090
  # series/3.7.x = 3.7.1-15-2f94201 (publishLocal, 2026-11-10), 2026-11-25
  series/3.7.x: |
    (same lines as v3.7.1)
    REPRODUCED CE-0090
  # First exploratory run (scratch program, default runtime, submit 50 ms after the release
  # started, Future read 2 s later): parallel await=true: submit returned, Future None;
  # parallel await=false: submit returned, Future None; sequential await=true/false:
  # IllegalStateException("Dispatcher already closed").
expected: |
  The submission made during the release throws IllegalStateException("Dispatcher already
  closed"), or it is accepted and then runs (with await = true) or is canceled/failed (with
  await = false), so that its Future completes. The reproducer then prints "threw" or "ran" and
  its last line is NOT REPRODUCED CE-0090.
promised_by:
  - "Scaladoc of Dispatcher.parallel(await) and Dispatcher.sequential(await) (Dispatcher.scala:130-133, :168-171): 'Once the resource scope exits, depending on the termination policy all active effects will be canceled or awaited, and attempts to submit new effects will throw an exception.'"
  - "Scaladoc of Dispatcher#unsafeToFuture (Dispatcher.scala:68-71): 'Submits an effect to be executed, returning a Future that holds the result of its evaluation.'"
  - "Maintainer intent: issue #3501 / PR #3579 (a releasing dispatcher rejects new tasks) and the DispatcherSuite test 'reject new tasks while shutting down'."
cause: >
  The dispatcher-level flag `doneR` is set by a finalizer that runs after the executor release
  (Dispatcher.scala:257-262 acquires it before `executorF`, :273), while the workers stop taking
  from their queues before the executor release (the Worker finalizer :487 runs first). A
  registration offered after the pill is never taken, never failed, never canceled. Before PR #3701
  ("remove `alive` in favour of nullifying queues") the check used a different mechanism.
possible_fix: >
  Set the dispatcher `doneR` before the workers are poisoned: for example acquire the
  `termination` resource after the workers (so its finalizer runs first), or set `doneR` in the
  Worker finalizer before it offers the pill. This closes the window seen by submissions that
  check after the flag is set. A submission that read `doneR = false` just before it was set can
  still be offered after the pill on another thread, so the worker should also drain its queue
  after the pill and complete each left-over registration (fail its Promise with
  IllegalStateException, or run it with await = true), and complete a pending `CancelRequested`
  latch.
