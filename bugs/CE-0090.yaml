lean:
  property: CatsEffectInLean.Props.Phase7.Dispatcher.dispNoLostSubmission
  theorem: CatsEffectInLean.Proofs.Phase7.DispatcherBattery.dispNoLostSubmission_refuted
  registry: CatsEffectInLean/RegistryHeavy.lean (std.Dispatcher.noLostSubmission, refuted; heavy, decision 55)
  run: "Proofs/Phase7/DispatcherRuns/R32*.lean (redone after review batch 16, B1: the root now joins the fiber that submits concurrently, so 'the root is done' means every submission returned or threw): parallel(await = true), one pure effect from the use body and one from a fiber the body starts, schedule sched 18 300, 370 micro-steps (kernel, 5 chunks). Kernel fact DispatcherBattery.ce0090_accepted_never_run: the root is done Succeeded(()); effect 0 ran (status 2); the submission of effect 1 returned (accepted: its unsafeToFutureCancelable result is in harness cell 6), did not throw (rejected = 0), and effect 1 never started (status 0)."
  fixed_twin: "variant 32 of Std/Dispatcher.lean (not Cats Effect code): the Worker finalizer sets the dispatcher doneR before it offers the PoisonPill (variant 30) and then waits until the worker took the pill (variant 31, the fix of CE-0091). Same input and schedule (run R33, 384 micro-steps): the root is done and the conclusion of the statement holds (effect 0 ran; the submission of effect 1 threw IllegalStateException) (DispatcherBattery.noLost_twin32). Checked on this input and schedule only (decision 39)."
  ordinary_inputs: "The input is ordinary: one running task, one release, one concurrent submission (await = true). Satisfiability witness: noLost_sat (run R34, sequential, FIFO: the root is done, effect 0 ran, the concurrent submission threw). That is one run, not a proof that sequential meets the statement."
