id: CE-0090
title: "Dispatcher.parallel: an effect submitted while the release runs is accepted but never runs, and its Future never completes"
status: draft  # found in Phase 7 batch 7.2, track P7D (2026-11-25) by reading the source; reproduced on v3.7.1, series/3.x, series/3.7.x; refuted in Lean (2026-11-25, decision 66)
priority: medium
kind: hang
area: std
files:
  - std/shared/src/main/scala/cats/effect/std/Dispatcher.scala:254-285  # resource order: outer Supervisor, terminationLatch, doneR, executor, workers
  - std/shared/src/main/scala/cats/effect/std/Dispatcher.scala:257-258  # termination finalizer: doneR.set(true), runs after the executor release
  - std/shared/src/main/scala/cats/effect/std/Dispatcher.scala:293-295  # submission checks only doneR
  - std/shared/src/main/scala/cats/effect/std/Dispatcher.scala:331-338  # submission offers the registration to a worker queue
  - std/shared/src/main/scala/cats/effect/std/Dispatcher.scala:461-469  # PoisonPill: worker sets its doneR, then only waits for terminationLatch
  - std/shared/src/main/scala/cats/effect/std/Dispatcher.scala:487      # Worker finalizer offers the PoisonPill (released first)
  - std/shared/src/main/scala/cats/effect/std/Dispatcher.scala:615-621  # Executor.parallel = Supervisor(await): joinAll or cancelAll on release
functions:
  - Dispatcher.parallel (await = true and await = false)
  - Dispatcher#unsafeToFutureCancelable (and unsafeToFuture, unsafeRunCancelable, unsafeRunAndForget, unsafeRunSync, unsafeRunTimed, unsafeToCompletableFuture)
summary: >
  The release of `Dispatcher.parallel` runs the resource finalizers in reverse order. First each
  `Worker` finalizer offers a `PoisonPill` to its queue (Dispatcher.scala:487). The worker takes
  the pill, sets its own `doneR`, and from then on only waits for `terminationLatch`; it never
  takes from its queue again (:461-469). Then the executor `Supervisor(await)` is released
  (:615-621): with `await = true` it waits for all running tasks, with `await = false` it cancels
  them and waits for the cancelation. Only after that does the `termination` finalizer set the
  dispatcher `doneR` (:257-258). A submission checks only this `doneR` (:293-295). So a submission
  in the window between the poison pill and `doneR.set(true)` passes the check, is offered to a
  worker queue behind the pill (:331-338), and nobody takes it: the effect never runs, the
  returned `Future` is never completed, `unsafeRunAndForget` drops the effect without a report,
  and a cancel action returned for it waits forever (`CancelRequested` latch, :343-346). With
  `await = true` the window lasts as long as the longest running task, so a running task that
  submits a follow-up effect (a common pattern) loses it every time. `sequential` is not
  affected: its executor is `inplace` (no Supervisor), so `doneR` is set right after the poison
  pill without a suspension in between (the reproducer's first runs: `IllegalStateException`).
likelihood: >
  Medium. Any program that submits work to a parallel `Dispatcher` while the dispatcher shuts down
  can hit it: callbacks of a Java library (HTTP server, message consumer, scheduler) that keep
  calling `unsafeRunAndForget` / `unsafeRunSync` during a graceful shutdown with
  `Dispatcher.parallel(await = true)`, or a dispatched task that submits a follow-up task. With
  `await = true` the window is the whole time the release waits for running tasks; a caller that
  blocks on the result (`unsafeRunSync`, `Await.result` on the `Future`) then hangs forever and can
  block the shutdown itself. With `await = false` the window is short (about 70 ms on the default
  runtime in our runs, the time to cancel the tasks and stop the workers). The reproducer shows
  the lost submission in 50/50 TestControl seeds and 50/50 runs on the default runtime.
maybe_intended: >
  Unlikely. The Scaladoc of `parallel` and `sequential` says that once the resource scope exits
  "attempts to submit new effects will throw an exception", and the maintainers fixed the related
  issue #3501 so that a dispatcher that is releasing itself rejects new tasks (PR #3579). The test
  "reject new tasks while shutting down" (tests/shared/src/test/scala/cats/effect/std/DispatcherSuite.scala:500-517,
  run for every dispatcher through `common`, also `parallel(await = true)`) checks this window, but
  it cannot fail: its `for` ends with `yield fail("fail")`, so the program raises in every run and
  `assert(r.isLeft)` always holds. A maintainer can say that submitting during release is a user
  error; but then the submission should still fail (throw or fail the Future) and not hang.
reproducer: reproducers/CE-0090/Repro.scala
